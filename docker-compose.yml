services:
  app:
    build: .
    container_name: clientflow_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./.env:/var/www/.env
    networks:
      - clientflow
    depends_on:
      - db

  webserver:
    image: nginx:alpine
    container_name: clientflow_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    networks:
      - clientflow
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: clientflow_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: clientflow
      MYSQL_USER: clientflow_user
      MYSQL_PASSWORD: clientflow123!
      MYSQL_ROOT_PASSWORD: secret
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - clientflow

networks:
  clientflow:
    driver: bridge

volumes:
  dbdata:
    driver: local
